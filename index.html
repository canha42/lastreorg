<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Reorg Tracker</title>
    <style>
        :root {
            --bg-color: #3D3D3D ;
            --text-color: #F5F5F5;
            --accent-color: #c7c7c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: rgb(229, 229, 229);
        }

        #counter-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            margin-top: 0.5rem;
            opacity: 0.5;
        }
        #lastreorg {
            margin-top: 2rem;
        }
        #lastreorg p {
            font-size: 0.75rem;
            letter-spacing: 0.1rem;
            margin-top: 0.5rem;
        }

        footer {
            position: fixed;
            bottom: 2rem;
            font-size: 0.8rem;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>Days without a company reorg:</h1>
    </header>

    <div id="counter-container">
        <div class="unit">
            <span class="number" id="months">00</span>
            <span class="label">Months</span>
        </div>
        <div class="unit">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
        </div>
        <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
        </div>
        <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutes</span>
        </div>
        <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="label">Seconds</span>
        </div>
    </div>
    <div id="lastreorg">
        <p>Last reorg:</p>
        <p>29 September 2026 • 09:07 UTC</p>
        <p>&nbsp;</p>
        <p>Previous record:</p>
        <p>2 months, 6 days, 12 hours, 11 minutes</p>
        <p>&nbsp;</p>
        <p>World record:</p>
        <p>2 months, 6 days, 12 hours, 11 minutes</p>
    </div>
    <footer>
        Just a silly joke :)
    </footer>

    <script>
        // Set the announcement date in UTC (year, month, day, hour, minute, second) - NOTE THAT MONTH IS CURRENT-1
        const announcementDate = new Date(Date.UTC(2026, 8, 29, 9, 7, 0));

        function updateCounter() {
            const now = new Date();
            const diff = now - announcementDate;

            // Simple check if date is in the future
            if (diff < 0) {
                document.getElementById('counter-container').innerHTML = "Awaiting Announcement...";
                return;
            }

            // Calculations
            let seconds = Math.floor(diff / 1000);
            let minutes = Math.floor(seconds / 60);
            let hours = Math.floor(minutes / 60);
            let days = Math.floor(hours / 24);

            // Rough Month calculation (approx 30.44 days per month)
            const months = Math.floor(days / 30.4368);
            
            // Adjust values for display
            const displayDays = days % 30; // Approximation for visual simplicity
            const displayHours = hours % 24;
            const displayMinutes = minutes % 60;
            const displaySeconds = seconds % 60;

            // Update DOM
            document.getElementById('months').textContent = String(months).padStart(2, '0');
            document.getElementById('days').textContent = String(displayDays).padStart(2, '0');
            document.getElementById('hours').textContent = String(displayHours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(displayMinutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(displaySeconds).padStart(2, '0');
        }

        // Run immediately and then every second
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
